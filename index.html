⁷<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend's Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{

font-family:Poppins,sans-serif;
background:
linear-gradient(135deg,#0f0f12,#1d001d,#300024,#1d001d);

color:white;
overflow-x:hidden;

}

/* Scrollbar */

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{

background:#ff4fa0;
border-radius:10px;

}

/* Floating Hearts */

.hearts{

position:fixed;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
z-index:0;

}

.heart{

position:absolute;
bottom:-50px;
color:#ff69b4;
animation:float linear infinite;

}

@keyframes float{

0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}

100%{

transform:translateY(-120vh) rotate(360deg);
opacity:0;

}

}

/* Navigation */

nav{

position:fixed;
width:100%;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;

background:rgba(0,0,0,.35);

backdrop-filter:blur(12px);

z-index:1000;

}

.logo{

font-size:28px;
font-weight:700;
color:#ff7dc0;

}

nav ul{

display:flex;
list-style:none;
gap:30px;

}

nav a{

color:white;
text-decoration:none;
transition:.3s;

}

nav a:hover{

color:#ff69b4;

}

/* Hero */

.hero{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

padding:20px;

position:relative;

z-index:1;

}

.hero-content{

background:rgba(255,255,255,.08);

padding:60px;

border-radius:30px;

backdrop-filter:blur(20px);

box-shadow:0 0 50px rgba(255,105,180,.25);

max-width:900px;

animation:fadeUp 1.5s;

}

.hero h1{

font-family:"Great Vibes";

font-size:85px;

color:#ffb6d9;

margin-bottom:20px;

}

.hero h2{

font-size:28px;

margin-bottom:20px;

}

.hero p{

font-size:18px;

line-height:1.8;

color:#ddd;

margin-bottom:40px;

}

button{

padding:18px 40px;

border:none;

border-radius:50px;

font-size:18px;

background:#ff4fa0;

color:white;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.05);

box-shadow:0 0 30px hotpink;

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(80px);

}

to{

opacity:1;

transform:translateY(0);

}

}

section{

padding:120px 10%;

position:relative;

z-index:1;

}

.title{

text-align:center;

font-size:50px;

margin-bottom:60px;

font-family:"Great Vibes";

color:#ff9ed0;

}
/* Photo Gallery */

.gallery{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;

}

.gallery img{

width:100%;
height:420px;
object-fit:cover;

border-radius:25px;

transition:.5s;

box-shadow:0 0 25px rgba(255,105,180,.25);

}

.gallery img:hover{

transform:scale(1.05) rotate(1deg);

box-shadow:0 0 45px hotpink;

}

/* Love Letter */

.letter{

max-width:900px;

margin:auto;

background:rgba(255,255,255,.08);

padding:50px;

border-radius:30px;

backdrop-filter:blur(15px);

line-height:2;

font-size:18px;

box-shadow:0 0 35px rgba(255,105,180,.2);

}

/* Reasons */

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:30px;

}

.card{

padding:35px;

background:rgba(255,255,255,.08);

border-radius:25px;

backdrop-filter:blur(15px);

transition:.4s;

text-align:center;

}

.card:hover{

transform:translateY(-12px);

box-shadow:0 0 35px hotpink;

}

.card h3{

color:#ff8cc8;

margin-bottom:15px;

}

/* Footer */

footer{

padding:80px;

text-align:center;

background:black;

margin-top:100px;

}

footer h2{

font-family:"Great Vibes";

font-size:50px;

color:#ff8cc8;

margin-bottom:20px;

}

footer p{

color:#ddd;

font-size:18px;

}

@media(max-width:768px){

.hero h1{

font-size:58px;

}

.hero-content{

padding:35px;

}

.title{

font-size:42px;

}

nav ul{

display:none;

}

}

</style>
